# facehugger_config.yaml
# Per-leg placement config for the URDF generator. CAD-sourced data lives
# in fusion_export.json (mesh_files manifest, joints array, occurrence
# tree); this yaml only configures things the CAD doesn't know:
#   - which corner gets which mesh handedness (L vs R)
#   - per-leg shoulder pose (zero, limits, rpy)
#   - chassis-fixed servo properties (effort, velocity, visual flip)
#
# Authoritative spec: docs/PIPELINE_SPEC.md and docs/ASSEMBLY_HIERARCHY.md.
# All angles in degrees — generate_urdf.py converts to radians for URDF
# output. All positions come from fusion_export.json (no hardcoded coords
# here).

robot_name: facehugger
mesh_dir: exported_meshes/

# ---------------------------------------------------------------------------
# Base link: chassis. Mesh is generated by EXPORT_RULES (combined-rule on
# QuadrupedBody body + LipoCage body); brackets are NOT here — they're
# emitted as 4 chassis-fixed `leg_mount_{L,R}.stl` visuals on base_link
# from the legs[] list below.
# ---------------------------------------------------------------------------
base_link:
  name: base_link
  mesh: QuadrupedBody.stl

# ---------------------------------------------------------------------------
# Leg template: shared structure for all 4 legs.
#
# `links.<name>.mesh` is a Python format string with one substitution token:
#   {side}  - replaced per leg with `L` or `R` from the legs[] entry below.
# Link2 / Link3 don't include {side}; they share a single mesh per
# PIPELINE_SPEC §5.
#
# Joint axis / origin / limits live in fusion_export.json's `joints` array
# (Link1Revolute / Link2Revolute / Link3Revolute). The cad-name → urdf-name
# + parent/child topology is fixed by convention and lives in
# generate_urdf.py's _JOINT_TOPOLOGY.
# ---------------------------------------------------------------------------
leg_template:
  leg_assembly_occurrence: "FaceHuggerLegAssembly:1"

  links:
    link1:
      mesh: "leg_shoulder_{side}.stl"
    link2:
      mesh: "leg_upper.stl"
    link3:
      mesh: "leg_lower.stl"

# ---------------------------------------------------------------------------
# 4 leg instances. PIPELINE_SPEC §1, §3, §4 are authoritative for these
# values. In short:
#
#   - Diagonal pairs share a mesh. {FL, BR} use the L mesh; {FR, BL} use R.
#   - rpy_z_deg = 0 for the "base" leg of each pair (FL with L, FR with R).
#     rpy_z_deg = 180 for the "back" leg of each pair (BR, BL) — rotates
#     the leg geometry 180° around its own LegMountPointXX so it faces
#     outward instead of inward.
#   - Shoulder limits are flipped for legs whose zero direction is +X
#     (FR, BR) vs -X (FL, BL): per §4, +X legs get [-45°, +105°] and -X
#     legs get [-105°, +45°].
#   - shoulder_neutral_deg = 0° for all legs — zero is "leg pointing
#     along the chassis ±X axis" per §4. simulate derives standing
#     pose from this.
# ---------------------------------------------------------------------------
legs:
  - id: fl
    mount_point: LegMountPointFL
    side: L
    rpy_z_deg: 0
    shoulder_limits_deg: [-105, +45]
    shoulder_neutral_deg: 0

  - id: br
    mount_point: LegMountPointBR
    side: L
    rpy_z_deg: 180
    shoulder_limits_deg: [-45, +105]
    shoulder_neutral_deg: 0

  - id: fr
    mount_point: LegMountPointFR
    side: R
    rpy_z_deg: 0
    shoulder_limits_deg: [-45, +105]
    shoulder_neutral_deg: 0

  - id: bl
    mount_point: LegMountPointBL
    side: R
    rpy_z_deg: 180
    shoulder_limits_deg: [-105, +45]
    shoulder_neutral_deg: 0

# ---------------------------------------------------------------------------
# Servo physical properties (used for inertial blocks if physics export
# is unavailable or incomplete for individual servo occurrences) and the
# uniform visual flip applied to every chassis-fixed shoulder-servo
# visual.
# ---------------------------------------------------------------------------
servo:
  mass_kg: 0.060        # DFRobot SER0038 spec
  effort_nm: 2.94       # 30 kg·cm to N·m
  velocity_rad_s: 5.0

  # Uniform mesh-local rotation applied to every chassis-fixed shoulder
  # servo <visual>. Useful when the CAD's servo model points the wrong
  # way — saves a CAD rename/re-export pass. Applied AFTER the source
  # rotation, so a 180° X flip inverts the servo around its own shaft-
  # axis direction. Leave at [0, 0, 0] to trust the CAD verbatim.
  visual_flip_rpy_deg: [180, 0, 0]
