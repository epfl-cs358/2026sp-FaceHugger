# facehugger_config.yaml
# Defines the robot hierarchy and maps Fusion geometry to URDF structure.
# All angles in degrees — generate_urdf.py converts to radians for URDF output.
# All positions come from fusion_export.json (no hardcoded coords here).

robot_name: facehugger
mesh_dir: exported_meshes/

# ---------------------------------------------------------------------------
# Base link: which occurrences make up the chassis
#
# NOTE on `occurrences`: this list is documentation of *intent*, not something
# the generator iterates. The chassis mesh `QuadrupedBody.stl` is produced by
# ExportBodiesToURDF.py exporting the `FlexibleSkeleton:1` occurrence as a
# single STL — Fusion's `createSTLExportOptions` on an occurrence includes all
# descendant bodies at their placements, so all five occurrences below get
# baked into that one file. If you add/remove sub-assemblies inside
# FlexibleSkeleton in Fusion, re-exporting picks them up automatically; if you
# want the generator to actually enforce this list, wire it into MESH_EXPORTS
# there too.
# ---------------------------------------------------------------------------
base_link:
  name: base_link
  mesh: QuadrupedBody.stl
  occurrences:
    - FlexibleSkeleton:1/QuadrupedBody:1
    - FlexibleSkeleton:1/MotorMountFR:1
    - FlexibleSkeleton:1/MotorMountFL:1
    - FlexibleSkeleton:1/MotorMountBR:1
    - FlexibleSkeleton:1/MotorMountBL:1

# ---------------------------------------------------------------------------
# Leg template: joint/link definitions for one leg.
# The generator instantiates this 4x using the legs list below.
#
# axis_key / point_key: names of construction geometry in fusion_export.json
#   under the leg assembly occurrence (FaceHuggerLegAssembly:1)
# parent/child: logical names — prefixed with leg id at generation time
#   e.g. link1 → fr_link1
# limits_deg: [lower, upper] servo range
# ---------------------------------------------------------------------------
leg_template:
  leg_assembly_occurrence: "FaceHuggerLegAssembly:1"

  joints:
    - name: shoulder          # body → link1, yaw
      axis_key:  BodyToLink1Axis
      point_key: BodyToLink1Point
      parent: base_link       # special: stays base_link for all legs
      child:  link1
      # Widened from [-90, 90] so the side that uses a 180° shoulder stance
      # (one side of the body — see the legs: section below) can reach its
      # neutral pose. We exposing ±180° in the URDF; physical servos with a
      # narrower mechanical range should stay within their useful band
      # during gait motion.
      limits_deg: [-180, 180]

    - name: hip               # link1 → link2, pitch
      axis_key:  Link1ToLink2Axis
      point_key: Link1ToLink2Point
      parent: link1
      child:  link2
      limits_deg: [-90, 90]

    - name: knee              # link2 → link3, pitch
      axis_key:  Link2ToLink3Axis
      point_key: Link2ToLink3Point
      parent: link2
      child:  link3
      limits_deg: [-135, 30]

  links:
    link1:
      occurrence: "FaceHuggerLegAssembly:1/Link1:1"
      mesh: leg_shoulder.stl

    link2:
      occurrence: "FaceHuggerLegAssembly:1/Link2:1"
      mesh: leg_upper.stl

    link3:
      occurrence: "FaceHuggerLegAssembly:1/Link3:1"
      mesh: leg_lower.stl

# ---------------------------------------------------------------------------
# 4 leg instances.
# mount_point: name of a construction point on FlexibleSkeleton:1 that
#   defines where this leg's shoulder joint sits in body frame.
# rpy_z_deg: rotation around Z applied to the shoulder joint frame.
#   0   = same orientation as the template leg (FR/BL)
#   180 = mirrored (FL/BR)
# ---------------------------------------------------------------------------
legs:
  # All four legs use rpy_z_deg = 90 — the CAD's FaceHuggerLegAssembly has
  # a +90° LAL rotation baked in via its world transform, and matching that
  # value here makes R_L1 = 0 for every leg (generator applies R_L1 =
  # R_z(-rpy_z_deg) @ R_lal, which = 0 when rpy_z_deg == lal_angle). With
  # R_L1 = 0, no per-leg frame rotation is applied to joint offsets, axes,
  # or meshes; all four legs share identical joint frames and can use the
  # SAME hip/knee stance signs.
  #
  # To orient the four legs around the body, we differentiate them via the
  # shoulder JOINT ANGLE at stance time (simulate_v2.STANCE_DEG_V2), not the
  # static rpy_z here. Right legs (fr, br) use shoulder = 0°, left legs
  # (fl, bl) use shoulder = 180°. This requires the shoulder joint limit to
  # span at least [-135, 135] (widened above).
  - id: fr
    mount_point: LegMountFR
    rpy_z_deg: 90

  - id: br
    mount_point: LegMountBR
    rpy_z_deg: 90

  - id: fl
    mount_point: LegMountFL
    rpy_z_deg: 90

  - id: bl
    mount_point: LegMountBL
    rpy_z_deg: 90

# ---------------------------------------------------------------------------
# Servo physical properties (used for inertial blocks if physics export
# is unavailable or incomplete for individual servo occurrences)
# ---------------------------------------------------------------------------
servo:
  mass_kg: 0.060        # DFRobot SER0038 spec
  effort_nm: 2.94       # 30 kg·cm to N·m
  velocity_rad_s: 5.0
