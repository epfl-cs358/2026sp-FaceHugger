# sim_config.yaml — PyBullet physics tuning constants
# All values in SI units (kg, m, s, N, N·m, …) unless noted.

contact:
  stiffness: 80000
  damping: 1000
  restitution: 0.1

motor:
  position_gain: 0.1
  velocity_gain: 0.5

damping:
  linear: 0.0
  angular: 0.0

friction:
  foot_lateral: 3.0
  foot_spinning: 0.05

solver:
  iterations: 300
  substeps: 4
  # timestep is always 1/240 (firmware tick rate) — see pybullet_sim/paths.py

mass:
  servo_mass_g: 60.0
  use_urdf_inertia: true
  mass_correction_factor: 1.0
